<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171916" />
    <meta name="description" content="赵洲钰的个人作品与项目经历，展示 AI 漫剧、视觉资产、视频生成和后期剪辑能力。" />
    <title>赵洲钰 — 个人作品</title>
    <link rel="stylesheet" href="styles.css?v=3" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="glass-shell">
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header" id="top">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="返回首页">
          <span class="brand-mark" data-brand-mark>ZZY</span>
          <span class="brand-word" data-brand-name>赵洲钰</span>
        </a>
        <nav class="desktop-nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="resume.html">简历</a>
          <a href="works.html" aria-current="page">作品</a>
          <a href="index.html#contact">联系</a>
        </nav>
        <button class="menu-toggle icon-button" type="button" aria-expanded="false" aria-controls="mobile-nav" aria-label="打开菜单">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航" hidden>
        <a href="index.html">首页</a>
        <a href="resume.html">简历</a>
        <a href="works.html" aria-current="page">作品</a>
        <a href="index.html#contact">联系</a>
      </nav>
      <div class="scroll-progress" aria-hidden="true"><span data-scroll-progress></span></div>
    </header>

    <main id="main-content">
      <section class="page-intro section-pad" aria-labelledby="page-title">
        <div class="container page-intro-grid">
          <div class="reveal">
            <p class="eyebrow">作品集</p>
            <h1 id="page-title">个人作品</h1>
          </div>
          <div class="page-intro-copy reveal" data-reveal-delay="80">
            <p>集中展示我独立或深度参与的 AIGC 内容、AI 漫剧与视频剪辑作品。</p>
            <a class="text-link" href="resume.html">先看个人简历 <i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
          </div>
        </div>
      </section>

      <section class="personal-work section-pad" id="personal-work" aria-labelledby="personal-work-title">
        <div class="container section-heading reveal">
          <div>
            <p class="eyebrow">个人作品</p>
            <h2 id="personal-work-title">个人作品，<br /><em>持续更新。</em></h2>
          </div>
          <p class="section-aside">这里收录项目成果证据，完整成片、剪辑片段和视觉资产案例将持续更新。</p>
        </div>
        <div class="container personal-work-grid" data-personal-works></div>
      </section>

      <section class="work section-pad" id="work" aria-labelledby="work-title">
        <div class="container section-heading work-heading reveal">
          <div>
            <p class="eyebrow">项目与流程</p>
            <h2 id="work-title">项目经历，<br /><em>制作流程。</em></h2>
          </div>
          <div class="filter-list" role="group" aria-label="筛选项目类型" data-filters></div>
        </div>
        <div class="container project-grid" data-projects></div>
      </section>

      <section class="next-step next-step-blue section-pad" aria-labelledby="contact-route-title">
        <div class="container next-step-inner reveal">
          <div>
            <p class="eyebrow">联系</p>
            <h2 id="contact-route-title">对我的作品感兴趣？<br /><em>欢迎联系。</em></h2>
          </div>
          <a class="button button-blue" href="index.html#contact">查看联系方式 <i data-lucide="arrow-right" aria-hidden="true"></i></a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span data-year></span> <span data-footer-name>赵洲钰</span>. Built with intent.</p>
        <div class="social-links" data-socials></div>
        <a class="back-to-top" href="#top" aria-label="返回顶部" title="返回顶部"><i data-lucide="arrow-up" aria-hidden="true"></i></a>
      </div>
    </footer>

    <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
      <div class="dialog-shell">
        <button class="dialog-close icon-button" type="button" data-dialog-close aria-label="关闭项目详情" title="关闭项目详情"><i data-lucide="x" aria-hidden="true"></i></button>
        <div class="dialog-media" data-dialog-media></div>
        <div class="dialog-body">
          <div class="dialog-meta"><span data-dialog-category></span><span data-dialog-year></span></div>
          <h2 id="dialog-title" data-dialog-title></h2>
          <p data-dialog-detail></p>
          <section class="dialog-process" data-dialog-process aria-labelledby="dialog-process-title" hidden>
            <p class="eyebrow">制作过程</p>
            <h3 id="dialog-process-title">制作过程</h3>
            <div class="dialog-gallery" data-dialog-gallery></div>
          </section>
          <div class="dialog-footer"><span data-dialog-role></span><div data-dialog-tags></div></div>
        </div>
      </div>
    </dialog>

    <noscript><div class="noscript-note">请开启 JavaScript 以查看完整作品内容。</div></noscript>
    <script src="content.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
