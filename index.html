<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="赵洲钰的个人作品集，展示红果 AI 漫剧制作、AIGC 视觉资产、视频生成与后期剪辑能力。" />
    <title>赵洲钰 — AIGC 内容创作者与视频剪辑师</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header" id="top">
      <div class="container header-inner">
        <a class="brand" href="#top" aria-label="返回首页">
          <span class="brand-mark" data-brand-mark>ZZY</span>
          <span class="brand-word" data-brand-name>赵洲钰</span>
        </a>
        <nav class="desktop-nav" aria-label="主导航">
          <a href="#about">简介</a>
          <a href="#resume">经历</a>
          <a href="#strengths">能力</a>
          <a href="#work">项目</a>
          <a href="#contact">联系</a>
        </nav>
        <button class="menu-toggle icon-button" type="button" aria-expanded="false" aria-controls="mobile-nav" aria-label="打开菜单">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航" hidden>
        <a href="#about">简介</a>
        <a href="#resume">经历</a>
        <a href="#strengths">能力</a>
        <a href="#work">项目</a>
        <a href="#contact">联系</a>
      </nav>
      <div class="scroll-progress" aria-hidden="true"><span data-scroll-progress></span></div>
    </header>

    <main id="main-content">
      <section class="hero section-pad" aria-labelledby="hero-title">
        <div class="container hero-grid">
          <div class="hero-copy reveal">
            <p class="hero-identity"><strong data-hero-name></strong><span data-hero-role></span></p>
            <h1 id="hero-title" data-hero-title></h1>
            <p class="hero-description" data-hero-description></p>
            <div class="hero-actions">
              <a class="button button-blue" href="#work">查看项目 <i data-lucide="arrow-down-right" aria-hidden="true"></i></a>
              <a class="text-link" href="#contact">联系我 <i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
            </div>
            <p class="hero-note" data-hero-note></p>
          </div>
          <div class="hero-visual reveal" data-reveal-delay="120">
            <div class="hero-image-wrap" data-hero-tilt>
              <img data-hero-image src="" alt="" />
              <div class="hero-image-caption">
                <span data-hero-count></span>
                <span data-hero-caption></span>
              </div>
            </div>
            <div class="availability-pill"><span class="status-dot"></span><span data-availability></span></div>
          </div>
        </div>
        <div class="container hero-bottomline">
          <span class="scroll-label"><i data-lucide="mouse" aria-hidden="true"></i> 向下浏览</span>
          <span class="hero-location" data-location></span>
        </div>
      </section>

      <section class="statement section-pad" id="about" aria-labelledby="about-title">
        <div class="container statement-grid">
          <p class="eyebrow reveal" data-about-eyebrow></p>
          <div class="statement-main reveal" data-reveal-delay="80">
            <h2 id="about-title" data-about-title></h2>
            <p class="statement-body" data-about-body></p>
            <p class="statement-quote" data-about-quote></p>
          </div>
        </div>
        <div class="container stat-row reveal" data-reveal-delay="140" data-stats></div>
      </section>

      <section class="resume section-pad" id="resume" aria-labelledby="resume-title">
        <div class="container section-heading reveal">
          <div>
            <p class="eyebrow" data-resume-eyebrow></p>
            <h2 id="resume-title" data-resume-title></h2>
          </div>
          <p class="section-aside" data-resume-intro></p>
        </div>
        <div class="container resume-layout">
          <aside class="resume-summary reveal" aria-label="履历摘要" data-reveal-delay="80">
            <dl class="resume-facts" data-resume-facts></dl>
            <div class="resume-tools">
              <p class="resume-kicker">TOOLS &amp; SKILLS</p>
              <div class="resume-skill-list" data-resume-skills></div>
            </div>
            <div class="resume-download">
              <a class="button button-blue" data-cv-link href="#" hidden>下载完整简历 <i data-lucide="download" aria-hidden="true"></i></a>
              <span data-resume-file-note></span>
            </div>
          </aside>
          <div class="resume-experience" data-resume-experience></div>
        </div>
      </section>

      <section class="strengths section-pad" id="strengths" aria-labelledby="strengths-title">
        <div class="container section-heading reveal">
          <div>
            <p class="eyebrow">CAPABILITIES</p>
            <h2 id="strengths-title">一套工作流，<br /><em>贯穿每一帧。</em></h2>
          </div>
          <p class="section-aside">不是孤立地使用工具，而是让每一个环节为最后的成片服务。</p>
        </div>
        <div class="container strengths-grid" data-strengths></div>
      </section>

      <section class="work section-pad" id="work" aria-labelledby="work-title">
        <div class="container section-heading work-heading reveal">
          <div>
            <p class="eyebrow">PROJECT / WORKFLOW</p>
            <h2 id="work-title">项目经验，<br /><em>成果落地。</em></h2>
          </div>
          <div class="filter-list" role="group" aria-label="筛选作品类型" data-filters></div>
        </div>
        <div class="container project-grid" data-projects></div>
      </section>

      <section class="contact section-pad" id="contact" aria-labelledby="contact-title">
        <div class="container contact-grid reveal">
          <div>
            <p class="eyebrow">CONTACT</p>
            <h2 id="contact-title">下一部作品，<br /><em>从这里开始。</em></h2>
          </div>
          <div class="contact-details">
            <p>如果你需要一位能独立推进 AI 漫剧制作、视觉资产、视频生成与后期剪辑的创作者，欢迎联系我。</p>
            <div class="contact-methods" aria-label="联系方式">
              <div class="contact-method">
                <span class="contact-method-label">手机</span>
                <a class="contact-method-value" data-phone-link href="tel:18570252625"></a>
                <button class="icon-button copy-contact" type="button" data-copy-phone aria-label="复制手机号" title="复制手机号"><i data-lucide="copy" aria-hidden="true"></i></button>
              </div>
              <div class="contact-method">
                <span class="contact-method-label">微信</span>
                <span class="contact-method-value" data-wechat></span>
                <button class="icon-button copy-contact" type="button" data-copy-wechat aria-label="复制微信号" title="复制微信号"><i data-lucide="copy" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span data-year></span> <span data-footer-name>赵洲钰</span>. Built with intent.</p>
        <div class="social-links" data-socials></div>
        <a class="back-to-top" href="#top" aria-label="返回顶部" title="返回顶部"><i data-lucide="arrow-up" aria-hidden="true"></i></a>
      </div>
    </footer>

    <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
      <div class="dialog-shell">
        <button class="dialog-close icon-button" type="button" data-dialog-close aria-label="关闭项目详情" title="关闭项目详情"><i data-lucide="x" aria-hidden="true"></i></button>
        <div class="dialog-media" data-dialog-media></div>
        <div class="dialog-body">
          <div class="dialog-meta"><span data-dialog-category></span><span data-dialog-year></span></div>
          <h2 id="dialog-title" data-dialog-title></h2>
          <p data-dialog-detail></p>
          <div class="dialog-footer"><span data-dialog-role></span><div data-dialog-tags></div></div>
        </div>
      </div>
    </dialog>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
    <noscript><div class="noscript-note">请开启 JavaScript 以查看完整作品集。</div></noscript>
    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
